[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/guitars/ibanez-ar500-cherry-sunburst-1982/"
  to = "/guitars/ibanez-ar500-cherry-sunburst-1983/"
  status = 301

[[redirects]]
  from = "/guitars/:id/"
  to = "/guitar.html?id=:id"
  status = 200

# Pre-render product content for crawlers on both legacy and canonical URLs.
[[edge_functions]]
  function = "guitar-seo"
  path = "/guitar"

[[edge_functions]]
  function = "guitar-seo"
  path = "/guitar.html"

[[edge_functions]]
  function = "guitar-seo"
  path = "/guitars/*"
