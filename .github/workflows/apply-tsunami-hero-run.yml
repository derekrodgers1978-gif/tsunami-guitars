name: Apply Tsunami Hero Run

on:
  push:
    paths:
      - 'tsunami-guitars/.hero-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hero
        shell: python
        run: |
          from pathlib import Path
          import base64
          root=Path('tsunami-guitars')
          payload=''.join((root/'.hero-chunks'/f'part{i}.txt').read_text().strip() for i in (1,2,3))
          (root/'images'/'tsunami-hero.webp').write_bytes(base64.b64decode(payload))
          p=root/'index.html'; h=p.read_text(encoding='utf-8')
          if '/* TSUNAMI HERO 2026 */' not in h:
              css='''
  /* TSUNAMI HERO 2026 */
  #page-bg{z-index:-3!important}.site-dragon-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.065;background-image:url("images/img_02.jpg"),url("images/img_02.jpg");background-repeat:no-repeat;background-position:calc(100% + 300px) 24vh,-340px 145vh;background-size:920px 920px,860px 860px;filter:sepia(1) saturate(.85) brightness(.58) contrast(1.15);mix-blend-mode:screen}.reverb,.brands,.why,.about,.contact,.merch,#sold,#why-buy,#blog,#insider,#guitar-santa,#instagram{background-color:rgba(14,11,8,.965)!important}
  #home.hero{min-height:620px;height:clamp(620px,66.666vw,1024px);display:block;position:relative;overflow:hidden;background:#0e0b08}#home .hero-bg{position:absolute;inset:0;background-image:url("images/tsunami-hero.webp")!important;background-size:cover!important;background-position:center top!important;background-repeat:no-repeat!important;z-index:0;transform:scale(1.002)}#home .hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,#0e0b08 0 92px,rgba(14,11,8,.06) 93px 78%,rgba(14,11,8,.30) 100%)!important;pointer-events:none}#home .hero-left,#home .hero-right{display:none!important}
  #home::before{content:'';position:absolute;right:-8%;bottom:-7%;width:70%;height:48%;z-index:1;pointer-events:none;opacity:.34;background:radial-gradient(ellipse at 32% 88%,transparent 0 47%,rgba(232,200,120,.14) 48% 49%,transparent 50%),radial-gradient(ellipse at 60% 78%,transparent 0 52%,rgba(245,232,192,.10) 53% 54%,transparent 55%),radial-gradient(ellipse at 82% 92%,transparent 0 44%,rgba(201,162,74,.13) 45% 46%,transparent 47%);filter:blur(.35px);animation:tgWaveDrift 10s ease-in-out infinite alternate;mix-blend-mode:screen}#home::after{content:'';position:absolute;right:5%;bottom:6%;width:52%;height:42%;z-index:1;pointer-events:none;opacity:.28;background-image:radial-gradient(circle,rgba(245,232,192,.40) 0 1px,rgba(201,162,74,.12) 2px,transparent 3px),radial-gradient(circle,rgba(245,232,192,.30) 0 1.5px,transparent 2.8px),radial-gradient(circle,rgba(201,162,74,.34) 0 1px,transparent 2.5px);background-size:130px 150px,185px 210px,240px 190px;background-position:10px 20px,70px 110px,140px 45px;animation:tgBubbles 14s linear infinite;mix-blend-mode:screen}@keyframes tgWaveDrift{0%{transform:translate3d(-1.5%,2%,0) scale(1.01);opacity:.22}50%{transform:translate3d(1%,-1%,0) scale(1.045);opacity:.38}100%{transform:translate3d(2%,.5%,0) scale(1.02);opacity:.28}}@keyframes tgBubbles{0%{transform:translate3d(0,45px,0);background-position:10px 20px,70px 110px,140px 45px}50%{transform:translate3d(8px,-30px,0);background-position:30px -35px,95px 35px,165px -15px}100%{transform:translate3d(-5px,-110px,0);background-position:50px -100px,120px -55px,190px -80px}}
  .hero-hotspots{position:absolute;inset:0;z-index:4;pointer-events:none}.hero-hotspot{position:absolute;pointer-events:auto;display:block;border:1px solid transparent;transition:border-color .18s,background .18s}.hero-hotspot:hover{border-color:rgba(232,200,120,.4);background:rgba(201,162,74,.035)}.hero-hotspot-products{left:4.1%;top:70.5%;width:17.3%;height:5.8%}.hero-hotspot-arrivals{left:22.4%;top:70.5%;width:14.3%;height:5.8%}.nav-brand .nav-logo{display:block;width:46px;height:46px;border-radius:50%;object-fit:cover}
  @media(max-width:768px){#home.hero{min-height:520px;height:72vh}#home .hero-bg{background-size:cover!important;background-position:37% center!important}#home .hero-bg::after{background:linear-gradient(to bottom,#0e0b08 0 72px,rgba(14,11,8,.04) 73px 78%,rgba(14,11,8,.3) 100%)!important}.hero-hotspots{display:none}.site-dragon-bg{opacity:.045;background-size:640px 640px,600px 600px;background-position:calc(100% + 250px) 32vh,-260px 150vh}}@media(prefers-reduced-motion:reduce){#home::before,#home::after{animation:none!important}}
'''
              h=h.replace('</style>\n</head>',css+'\n</style>\n</head>',1)
          d='<div class="site-dragon-bg" aria-hidden="true"></div>'
          if d not in h:
              bg='<div id="page-bg" style="position:fixed;inset:0;background:#0e0b08;z-index:-1;"></div>'
              h=h.replace(bg,bg+'\n'+d,1)
          if 'class="nav-logo"' not in h:
              h=h.replace('<a href="#" class="nav-brand">\n    <div class="nav-brand-text">','<a href="#" class="nav-brand">\n    <img src="images/img_02.jpg" class="nav-logo" alt="Tsunami Guitars">\n    <div class="nav-brand-text">',1)
          if 'hero-hotspot-products' not in h:
              hs='<div class="hero-hotspots" aria-label="Hero shortcuts"><a class="hero-hotspot hero-hotspot-products" href="#products" aria-label="Browse guitars"></a><a class="hero-hotspot hero-hotspot-arrivals" href="#products" aria-label="New arrivals"></a></div>'
              h=h.replace('  <div class="hero-bg"></div>','  <div class="hero-bg"></div>\n  '+hs,1)
          p.write_text(h,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsunami-guitars/index.html tsunami-guitars/images/tsunami-hero.webp
          git commit -m "Add selected Tsunami hero with animated waves" || exit 0
          git push
