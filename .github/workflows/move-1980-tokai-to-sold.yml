name: Move 1980 Tokai LC60 to Sold

on:
  push:
    paths:
      - '.github/workflows/move-1980-tokai-to-sold.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move 1980 Tokai LC60 listing to sold
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          index_path = Path('tsunami-guitars/index.html')
          html = index_path.read_text(encoding='utf-8')

          # Remove only the 1980 Tokai LC60 card from Current Inventory.
          card_pattern = re.compile(
              r'\n\s*<!-- GUITAR 16: 1980 Tokai LC60 Wine Red -->.*?(?=\n\s*<!-- GUITAR 17:|\n\s*<!-- GUITAR 18:|\n\s*</div>\s*</section>)',
              re.S,
          )
          html, removed = card_pattern.subn('\n', html, count=1)
          if removed != 1:
              raise SystemExit(f'Expected to remove 1 Tokai LC60 inventory card, removed {removed}')

          # Add it to the Sold Grid using the existing sold-card style.
          sold_card = r'''

      <!-- SOLD CARD: 1980 Tokai LC60 Wine Red -->
      <div style="border:1px solid rgba(201,162,74,0.1);background:#0e0b08;overflow:hidden;opacity:0.75;">
        <div style="position:relative;overflow:hidden;background:#0e0b08;">
          <img src="images/tokairw01.jpg" style="width:100%;height:240px;object-fit:contain;object-position:center;background:#0e0b08;filter:grayscale(30%);">
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
            <div style="border:3px solid rgba(180,30,30,0.85);padding:0.4rem 1.4rem;transform:rotate(-15deg);background:rgba(14,11,8,0.4);">
              <span style="font-family:'Josefin Sans',sans-serif;font-size:1.4rem;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;color:rgba(200,50,50,0.9);">SOLD</span>
            </div>
          </div>
        </div>
        <div style="padding:1.2rem;">
          <p style="font-family:'Josefin Sans',sans-serif;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);opacity:0.5;margin-bottom:0.3rem;">1980 · Made in Japan · Tokai Gakki · Hamamatsu</p>
          <p style="font-family:'Shippori Mincho',serif;font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:0.2rem;">Tokai LC60</p>
          <p style="font-family:'Josefin Sans',sans-serif;font-size:0.6rem;letter-spacing:0.1em;color:var(--gold);opacity:0.6;">Wine Red · All Original · Case Queen</p>
        </div>
      </div>'''

          sold_grid = re.compile(r'(<!-- Sold Grid -->\s*<div style="display:grid;grid-template-columns:repeat\(auto-fill,minmax\(280px,1fr\)\);gap:2rem;">)')
          html, inserted = sold_grid.subn(r'\1' + sold_card, html, count=1)
          if inserted != 1:
              raise SystemExit(f'Expected to find Sold Grid once, found {inserted}')

          # Remove it from the embedded current-inventory assistant data.
          html, inventory_removed = re.subn(
              r'\n13\. 1980 Tokai LC60[^\n]*',
              '',
              html,
              count=1,
          )
          if inventory_removed != 1:
              raise SystemExit(f'Expected to remove Tokai from embedded inventory once, removed {inventory_removed}')

          index_path.write_text(html, encoding='utf-8')

          # Mark the detail-page data as sold.
          json_path = Path('tsunami-guitars/guitars.json')
          data = json.loads(json_path.read_text(encoding='utf-8'))
          matches = [g for g in data.get('guitars', []) if g.get('id') == 'tokai-lc60-wine-red-1980']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly 1 Tokai LC60 JSON entry, found {len(matches)}')
          matches[0]['status'] = 'sold'
          json_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsunami-guitars/index.html tsunami-guitars/guitars.json
          git commit -m "Move 1980 Tokai LC60 to sold"
          git push
